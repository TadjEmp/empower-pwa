<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <!-- Bug remonté (retour mobile) — maximum-scale=1/user-scalable=no bloquait tout pinch-to-zoom,
       y compris pour lire un texte trop petit. Zoom réactivé, plafonné pour ne pas casser la mise
       en page (barre de nav fixe, header) au-delà d'un facteur raisonnable. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#ED2567"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>ESI — Empower Sales Intelligence</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="stylesheet" href="css/base.css?v=19"/>
  <link rel="stylesheet" href="css/components.css?v=8"/>
  <link rel="stylesheet" href="css/comptes.css?v=3"/>
  <link rel="stylesheet" href="css/questionnaire.css?v=5"/>
  <link rel="stylesheet" href="css/dashboard.css?v=9"/>
  <link rel="stylesheet" href="css/pipeline.css?v=14"/>
  <link rel="stylesheet" href="css/v7.css?v=13"/>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <!-- Feuille de route Phase 1 — piège de focus pour les modales/drawer (utils.js#ModalAccessibilite) -->
  <script src="https://cdn.jsdelivr.net/npm/tabbable@6.5.0/dist/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/focus-trap@7.8.0/dist/focus-trap.umd.js"></script>
  <!-- Feuille de route Phase 1 — glisser-déposer du Tracker (vue-pipeline.js), animation
       de drag incluse (option `animation`) — cf. décision "auto-animate" dans le journal
       de la feuille de route : ce paquet suppose des mutations DOM incrémentales, incompatible
       avec le render() de cette app (innerHTML entièrement remplacé à chaque appel). -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
  <!-- Feuille de route Phase 4 — palette de commandes "Aller à…" (utils.js#PaletteCommandes).
       Build officiel non utilisable en <script> classique (imports bruts "lit" destinés à un
       bundler) : passe par la transformation ESM de jsDelivr (imports déjà résolus/empaquetés). -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/ninja-keys@1.2.2/+esm"></script>
</head>
<body>
  <ninja-keys placeholder="Aller à… (Tracker, Comptes, Planning…)" hotkeys-joined-view></ninja-keys>
  <div id="drawer-root"></div>
  <div id="topbar-root"></div>
  <div id="app">
    <div class="splash">
      <div class="splash-norton">
        <div class="splash-norton-mark">
          <svg viewBox="0 0 112 112" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true">
            <path d="M 96 33 A 46 46 0 1 1 79 16" stroke="currentColor" stroke-width="10.5" stroke-linecap="round"/>
            <polyline points="28,59 46,77 82,35" stroke="currentColor" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="splash-norton-word">norton<sup class="splash-tm">™</sup></span>
      </div>
      <div class="splash-nom">EMPOWER SALES INTELLIGENCE</div>
      <div class="splash-sous">Outil de pilotage terrain</div>
      <img src="img/logo-marvesting-sm.png" alt="Marvesting" style="height:16px;width:auto;margin-top:20px;opacity:.5"/>
      <div class="splash-spinner"></div>
    </div>
  </div>

  <!-- Couche API & utilitaires -->
  <script src="js/utils.js?v=32"></script>
  <script src="js/fiscal-weeks.js?v=1"></script>
  <script src="js/filter-state.js?v=1"></script>
  <script src="js/questionnaire-branching.js?v=1"></script>
  <script src="js/helpers.js?v=2"></script>
  <script src="js/session.js?v=3"></script>
  <script src="js/dashboard-activite.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/api.js?v=40"></script>
  <script src="js/groq.js?v=6"></script>
  <script src="js/gemini.js?v=3"></script>
  <script src="js/toast.js?v=4"></script>
  <script src="js/permissions.js?v=5"></script>
  <script src="js/router.js?v=8"></script>

  <!-- Vues V2.1 — Navigation 7 modules -->
  <script src="js/vue-login.js?v=6"></script>
  <script src="js/vue-dashboard-cds.js?v=26"></script>
  <!-- EMPOWER TRACKER (B3 : renommage complet) -->
  <script src="js/vue-pipeline.js?v=50"></script>
  <!-- COMPTES HISTORIQUES -->
  <script src="js/vue-comptes-historiques.js?v=14"></script>
  <!-- PHONING -->
  <script src="js/vue-phoning.js?v=31"></script>
  <!-- VISITES -->
  <script src="js/vue-visites.js?v=36"></script>
  <!-- Section 9 cahier des charges : vue consolidée Channel (lecture seule FDV) -->
  <script src="js/vue-visites-fdv.js?v=3"></script>
  <!-- SUIVI DES OBJECTIFS -->
  <script src="js/vue-objectifs.js?v=15"></script>
  <!-- SUIVI DES PRIMES -->
  <script src="js/vue-primes.js?v=14"></script>
  <!-- Vues auxiliaires -->
  <script src="js/vue-photos.js?v=9"></script>
  <script src="js/vue-comptes.js?v=22"></script>
  <script src="js/vue-fiche-compte.js?v=22"></script>
  <script src="js/vue-questionnaire.js?v=21"></script>
  <script src="js/vue-dashboard-manager.js?v=30"></script>
  <script src="js/vue-admin.js?v=26"></script>

  <!-- Centre de notifications (cloche + badge + panneau) -->
  <script src="js/notif-center.js?v=5"></script>

  <!-- Boot -->
  <script src="js/app.js?v=15"></script>
</body>
</html>
