  <script>
    (function () {
      try {
        var p = localStorage.getItem('esi_theme');
        var sombre = p === 'dark' || ((p !== 'light') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', sombre ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <!-- Bug remonté (retour mobile) — maximum-scale=1/user-scalable=no bloquait tout pinch-to-zoom,
       y compris pour lire un texte trop petit. Zoom réactivé, plafonné pour ne pas casser la mise
       en page (barre de nav fixe, header) au-delà d'un facteur raisonnable. -->
  <meta name="viewport" id="viewport-meta" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"/>
  <!-- Bug remonté (09/2026) — le pinch-to-zoom réactivé ci-dessus s'applique aussi en mode
       Web App installée (manifest.json display:standalone) : la page "bouge" comme une page
       web classique au lieu de l'app verrouillée attendue une fois installée sur le téléphone.
       Onglet navigateur normal → zoom conservé (fix ci-dessus). Web App installée (standalone/
       iOS "ajouter à l'écran d'accueil") → verrouillée, mise en page app-like. Doit s'exécuter
       avant le premier paint pour éviter un flash zoomable au lancement de l'app installée. -->
  <script>
    (function () {
      var estStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        || window.navigator.standalone === true;
      if (estStandalone) {
        var m = document.getElementById('viewport-meta');
        if (m) m.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
      }
    })();
  </script>
